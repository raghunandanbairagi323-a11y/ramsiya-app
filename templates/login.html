<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8"><title>रामसिया स्मार्ट ऐप</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style> body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; } .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 500px; } </style>
</head>
<body>
<div class="box">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>🚀 {% if lang == 'hi' %}रामसिया स्मार्ट बिलिंग{% else %}Ramsiya Smart Billing{% endif %}</h4>
        <div>
            <a href="/change-lang/hi" class="btn btn-sm btn-outline-dark {% if lang == 'hi' %}active{% endif %}">हिंदी</a>
            <a href="/change-lang/en" class="btn btn-sm btn-outline-dark {% if lang == 'en' %}active{% endif %}">English</a>
        </div>
    </div>
    
    {% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
    
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">{% if lang == 'hi' %}लॉगिन{% else %}Login{% endif %}</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">{% if lang == 'hi' %}नया दुकानदार रजिस्ट्रेशन{% else %}New Shop Registration{% endif %}</button></li>
    </ul>
    
    <div class="tab-content">
        <div class="tab-pane fade show active" id="login">
            <form action="/login" method="post">
                <div class="mb-2"><label class="small">{% if lang == 'hi' %}ईमेल आईडी{% else %}Email ID{% endif %}</label><input type="email" name="email" class="form-control" required></div>
                <div class="mb-3"><label class="small">{% if lang == 'hi' %}पासवर्ड{% else %}Password{% endif %}</label><input type="password" name="password" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100">{% if lang == 'hi' %}🔓 लॉगिन करें{% else %}🔓 Login Now{% endif %}</button>
            </form>
        </div>
        
        <div class="tab-pane fade" id="register">
            <form action="/register" method="post">
                <div class="row g-2">
                    <div class="col-6 mb-2"><label class="small">ईमेल</label><input type="email" name="email" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">पासवर्ड</label><input type="password" name="password" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">दुकान का नाम</label><input type="text" name="shop_name" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">मालिक का नाम</label><input type="text" name="owner_name" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">व्हाट्सएप नंबर</label><input type="text" name="phone" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">दुकान का पता</label><input type="text" name="address" class="form-control form-control-sm" required></div>
                    
                    <!-- ☑️ टिक बॉक्स प्लान सिस्टम -->
                    <div class="col-12 my-2"><label class="small fw-bold">☑️ अपना बेस्ट प्लान चुनें (Select Plan):</label>
                        <select name="selected_plan" class="form-select form-select-sm">
                            <option value="1m">1 महीना प्लान (1 Month)</option>
                            <option value="3m">3 महीना प्लान (3 Month)</option>
                            <option value="6m">6 महीना प्लान (6 Month)</option>
                            <option value="9m">9 महीना प्लान (9 Month)</option>
                            <option value="12m">12 महीना प्लान (12 Month)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 btn-sm mt-2">✨ स्टोर एक्टिवेट करें</button>
            </form>
        </div>
    </div>
</div>
<script src="https://jsdelivr.net"></script>
</body>
</html>
