<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8"><title>लॉगिन / रजिस्ट्रेशन - रामसिया स्मार्ट ऐप</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style> body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; } .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; } </style>
</head>
<body>
<div class="box">
    <text class="text-center d-block mb-3">🚀 <h3 class="d-inline">रामसिया स्मार्ट बिलिंग</h3></text>
    {% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
    
    <ul class="nav nav-tabs mb-3" id="myTab">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">लॉगिन</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">नया दुकानदार रजिस्ट्रेशन</button></li>
    </ul>
    
    <div class="tab-content">
        <!-- लॉगिन -->
        <div class="tab-pane fade show active" id="login">
            <form action="/login" method="post">
                <div class="mb-2"><label class="small">ईमेल आईडी</label><input type="email" name="email" class="form-control" required></div>
                <div class="mb-3"><label class="small">पासवर्ड</label><input type="password" name="password" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100">🔓 लॉगिन करें</button>
            </form>
        </div>
        <!-- रजिस्ट्रेशन -->
        <div class="tab-pane fade" id="register">
            <form action="/register" method="post">
                <div class="row g-2">
                    <div class="col-6 mb-2"><label class="small">ईमेल आईडी</label><input type="email" name="email" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">पासवर्ड</label><input type="password" name="password" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">दुकान का नाम</label><input type="text" name="shop_name" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">मालिक का नाम</label><input type="text" name="owner_name" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">मोबाइल नंबर</label><input type="text" name="phone" class="form-control form-control-sm" required></div>
                    <div class="col-6 mb-2"><label class="small">दुकान का पता</label><input type="text" name="address" class="form-control form-control-sm" required></div>
                    <div class="col-12 mb-3"><label class="small">अपनी दुकान की UPI ID (वैकल्पिक)</label><input type="text" name="upi_id" class="form-control form-control-sm" placeholder="जैसे: owner@upi"></div>
                </div>
                <button type="submit" class="btn btn-success w-100 btn-sm">✨ नया स्टोर एक्टिवेट करें</button>
            </form>
        </div>
    </div>
</div>
<script src="https://jsdelivr.net"></script>
</body>
</html>
